services:
  nodelink:
    container_name: nodelink
    image: performanc/nodelink:3.9.0@sha256:e15a9ae334f36432ed7f544521644bc99820eaba77ac4e592d939169b7a0bfa8
    pull_policy: always
    restart: unless-stopped
    environment:
      - NODELINK_SERVER_PASSWORD=${NODELINK_PASSWORD}
      - NODELINK_SOURCES_SPOTIFY_CLIENTID=${SPOTIFY_CLIENT_ID}
      - NODELINK_SOURCES_SPOTIFY_CLIENTSECRET=${SPOTIFY_CLIENT_SECRET}
      - NODELINK_SOURCES_YOUTUBE_CIPHER_URL=http://youtube-cipher:8081
      - NODELINK_SOURCES_YOUTUBE_CIPHER_TOKEN=${YOUTUBE_CIPHER_TOKEN}
    volumes:
      - nodelink-data:/data
    networks:
      - parlante-network
    depends_on:
      youtube-cipher:
        condition: service_started
    healthcheck:
      test:
        ['CMD', 'wget', '--no-verbose', '--tries=1', '--spider', 'http://localhost:3000/version']
      interval: 30s
      timeout: 5s
      start_period: 15s
      retries: 3

  youtube-cipher:
    container_name: youtube-cipher
    image: ghcr.io/kikkia/yt-cipher:master@sha256:4c5ec381ff57336cfc24822d2b526a5ad7cd0171f61065a1bbc87bb736842449
    restart: unless-stopped
    networks:
      - parlante-network
    environment:
      - PORT=8081
      - HOST=0.0.0.0

  parlante-xion:
    container_name: parlante-xion
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      - DISCORD_TOKEN=${DISCORD_TOKEN}
      - NODELINK_PASSWORD=${NODELINK_PASSWORD}
      - NODELINK_URL=${NODELINK_URL:-http://nodelink:3000}
      - DATA_DIR=/data
      - LANGUAGE=${LANGUAGE:-es-UY}
      - BOT_STATUS=${BOT_STATUS:-online}
      - BOT_ACTIVITY_TYPE=${BOT_ACTIVITY_TYPE:-LISTENING}
      - BOT_ACTIVITY=${BOT_ACTIVITY:-🎵 Pinchando unos temaikenes}
      - BOT_ACTIVITY_URL=${BOT_ACTIVITY_URL:-}
      - LOG_LEVEL=${LOG_LEVEL:-info}
      - PRETTY_LOGS=${PRETTY_LOGS:-true}
      - DATABASE_URL=${DATABASE_URL:-file:/data/db.sqlite}
    volumes:
      - parlante-xion:/data
    networks:
      - parlante-network
    depends_on:
      nodelink:
        condition: service_started
    healthcheck:
      test: ['CMD', 'pgrep', '-f', 'bun run src/index.ts']
      interval: 30s
      timeout: 5s
      start_period: 10s
      retries: 3

volumes:
  parlante-xion:
  nodelink-data:

networks:
  parlante-network:
    driver: bridge
